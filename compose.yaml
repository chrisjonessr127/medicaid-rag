services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run repair_medicaid_rag.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run repair_medicaid_rag.py first}
      POSTGRES_DB: ${POSTGRES_DB:?Run repair_medicaid_rag.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  demo_pgdata:
    name: medicaid_rag_synthetic_demo_pgdata
